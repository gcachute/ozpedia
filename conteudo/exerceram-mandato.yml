# Suplentes que exerceram mandato na Câmara sem estar na lista oficial de legislaturas nem num ato de convocação achado
# (as edições do Diário Oficial de 2009 a 2014 quase não estão no site da Prefeitura). Cada caso com a fonte que mostra
# a pessoa no exercício do cargo de vereador.
- pessoa: branco
  nomes: ["Reinaldo Hipólito Leal", "Reinaldo Hipólito Leal (Branco)"]
  legislatura: "2013-2016"
  fontes: [iomo-1107, iomo-1064]
  nota: "A Imprensa Oficial nº 1107, de fevereiro de 2015, lista Reinaldo Hipólito Leal (Branco) em comissões permanentes da Câmara, e a nº 1064, de setembro de 2014, registra a presença dele em sessão. No TSE, o único candidato com o nome de urna BRANCO na eleição de 2012 foi suplente pelo PMDB."
