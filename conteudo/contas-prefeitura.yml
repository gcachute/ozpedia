# Julgamento das contas anuais da Prefeitura pela Câmara Municipal, pelos decretos legislativos publicados na Imprensa
# Oficial do Município (IOMO). Cada entrada foi lida no texto da edição indicada.
# exercicio: ano das contas; resultado: aprovadas | rejeitadas; decreto: número do decreto legislativo;
# deliberacao: data da votação no plenário, quando o decreto informa; parecerTce: o que o decreto diz do parecer
# prévio do Tribunal de Contas do Estado, quando diz; edicao: a edição em que o decreto foi publicado.
# Anos sem entrada: o decreto não foi achado nas edições disponíveis no site da Prefeitura (2011 a 2013 não têm edições).

