# Imagens das páginas que não são de pessoa (e as imagens padrão de cada tipo de página).
# Só arquivos do Wikimedia Commons com licença livre; autor e licença são lidos do Commons por
# scripts/importar-imagens.mjs e aparecem como referência na legenda.
#
# Campos: chave (endereço da página, ou padrao/<tipo>), arquivo (nome no Commons), legenda e, se o crédito do
# Commons não for um nome legível, autor.
# Ordem de procura numa página: a chave da página; senão, padrao/<tipo>.
# Página de pessoa sem foto: a imagem da primeira legislatura em que exerceu mandato; senão, a da eleição
# de que participou; senão, padrao/pessoa.
#
# Os gráficos "Municipal council Osasco (SP) Brazil AAAA election.svg" foram conferidos com os resultados
# do TSE, partido por partido (2000 a 2016). O de 2020 não bate com o TSE e não é usado.

